<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Household Finance Agent — Bank connection</title>
<style>
body{font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;max-width:680px;margin:4rem auto;padding:0 1.25rem;color:#202733}
h1{line-height:1.2}p{margin:1rem 0}.muted{color:#5c6675}
button{font:inherit;padding:.65rem 1rem;border:0;border-radius:.35rem;background:#175ea8;color:#fff;cursor:pointer}
button:disabled{opacity:.65;cursor:wait}
</style>
</head>
<body>
<h1>Bank connection</h1>
<p id="status">Checking the authorisation response…</p>
<p class="muted" id="detail">This page does not store your bank login details or account information.</p>
<button id="handoff" type="button" hidden>Connect to the Household Finance Agent</button>
<script>
(() => {
  const status = document.getElementById("status");
  const detail = document.getElementById("detail");
  const button = document.getElementById("handoff");
  const params = new URLSearchParams(window.location.search);
  let code = params.get("code");
  let state = params.get("state");
  const error = params.get("error");

  // Keep one-time values out of the visible URL; they remain only in page memory.
  history.replaceState({}, document.title, window.location.pathname);

  if (error) {
    status.textContent = "The bank connection was not completed.";
    detail.textContent = "The authorisation service returned an error. Start a new connection from the Household Finance Agent.";
    return;
  }
  if (!code || !state) {
    status.textContent = "No authorisation response was found.";
    detail.textContent = "Start a new bank connection from the Household Finance Agent on your computer.";
    return;
  }

  status.textContent = "Your bank response is ready to hand off.";
  detail.textContent = "Select the button below. If your browser asks, allow Loopback access so this page can send the response to the agent running on this computer. The one-time code is not saved by this page.";
  button.hidden = false;

  button.addEventListener("click", async () => {
    button.disabled = true;
    status.textContent = "Connecting to the Household Finance Agent…";
    detail.textContent = "Waiting for the local agent to confirm receipt.";
    try {
      const response = await fetch("http://127.0.0.1:8765/callback", {
        method: "POST",
        targetAddressSpace: "loopback",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({code, state})
      });
      if (!response.ok) {
        status.textContent = "The local agent rejected the response.";
        detail.textContent = "Start a new bank connection from the running Household Finance Agent.";
        code = null;
        state = null;
        return;
      }
      status.textContent = "Bank authorisation response received.";
      detail.textContent = "Return to the Household Finance Agent window on your computer.";
      code = null;
      state = null;
      button.hidden = true;
    } catch (_) {
      status.textContent = "Could not reach the local Household Finance Agent.";
      detail.textContent = "Allow Loopback access for this page if your browser asks. If access was denied, re-enable it for dennmell.github.io in the page's site settings. Keep the agent running, then select the button again. The code stays only in this page's memory; refreshing requires a new bank connection.";
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
